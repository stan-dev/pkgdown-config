    functions:
      text: Functions
      href: reference/index.html
    pkgs:
      text: Other Packages
      menu:
        - text: bayesplot
          href: https://mc-stan.org/bayesplot
        - text: cmdstanr
          href: https://mc-stan.org/cmdstanr
        - text: loo
          href: https://mc-stan.org/loo
        - text: posterior
          href: https://mc-stan.org/posterior
        - text: priorsense
          href: https://mc-stan.org/priorsense/
        - text: projpred
          href: https://mc-stan.org/projpred
        - text: rstan
          href: https://mc-stan.org/rstan
        - text: rstanarm
          href: https://mc-stan.org/rstanarm
        - text: rstantools
          href: https://mc-stan.org/rstantools
        - text: shinystan
          href: https://mc-stan.org/shinystan
    roadmap:
      text: Roadmap
      href: articles/roadmap.html
    stan:
      text: About Stan
      href: https://mc-stan.org/about/
    bluesky:
      icon: fa-brands fa-bluesky
      aria-label: Visit our Bluesky profile
      href: https://bsky.app/profile/did:plc:qznndgdnkem2yryu7ipqbpv7
    forum:
      icon: fa-users
      aria-label: Visit our forums
      href: https://discourse.mc-stan.org/

home:
  links:
    - text: Ask a question
      href: http://discourse.mc-stan.org/

roadmap:
  enabled: false
  format: rmd
  exclude:
    labels: [internal*, wontfix, invalid]
  intro: |
    Welcome! This page shows what the core developers of **{package}** are
    working on right now and what we have planned for the coming releases. It
    highlights a selection of our main goals, not a complete list of everything
    we work on.

    We hope the roadmap is useful to you in a few ways:

    + **If you use {package}**, it shows what we currently prioritize and what
      changes are on their way, so you can plan ahead.
    + **If you would like to contribute**, it shows the topics we are actively
      thinking about. If one of them interests you, we would love to hear from
      you. Leave a comment on the linked issue, or reach out on the
      [Stan Forums](https://discourse.mc-stan.org/).
    + **If you think something important is missing**, or should get more
      attention, please tell us. Your input helps us decide what to work on
      next.

    ::: {.rm-note}
    **A note on plans.** This roadmap shows our strategic plans for the medium
    and long term. Alongside this work, we continue to respond to bug reports,
    questions, and requests as they come in. The roadmap describes our current
    intentions, not fixed commitments. Priorities can shift, and releases have
    no fixed dates. We update this page as our plans change.
    :::
  outro: |
    ## Get involved

    Contributions are welcome! Here are a few ways to join in:

    + **Try the development version** with
      `remotes::install_github("{repo}")`, and let us know what works well and
      what does not.
    + **Share your view on priorities.** Comment on an issue that matters to
      you, or let us know about features you are missing.
    + **Interested in contributing?** Browse our
      [open issues](https://github.com/{repo}/issues) and leave a comment on
      the one you would like to work on, or reach out on the
      [Stan Forums](https://discourse.mc-stan.org/).
    + **Read the
      [contributing guide](https://github.com/{repo}/blob/HEAD/.github/CONTRIBUTING.md)**
      for how we work.
